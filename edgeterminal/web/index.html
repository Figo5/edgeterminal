<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeTerminal</title>
<link rel="stylesheet" href="/static/style.css?v=projection-20260924b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>▨</text></svg>">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="mark">▨</span> EDGE<span class="dim">TERMINAL</span><small>NFL projections</small></div>
  <div class="topright">
    <span class="meta" id="lastUpdated">Updated —</span>
    <button id="chatToggle" class="btn" type="button">Research chat</button>
  </div>
</header>

<div id="shell">
  <aside id="rail">
    <nav id="sections"></nav>
    <div class="railfoot">
      <div id="modelVersion" class="meta"></div>
      <div class="meta disclaimer">Research only · all games PASS. No bets are placed.</div>
    </div>
  </aside>

  <main id="main"><div class="loading">Loading slate…</div></main>

  <section id="chat">
    <div class="chathead">
      <span>AI ANALYST</span>
      <span id="llmBadge" class="badge"></span>
      <button id="chatClose" class="iconbtn" title="Hide">×</button>
    </div>
    <div id="chatLog" class="chatlog"></div>
    <div class="suggest" id="suggest"></div>
    <form id="chatForm" class="chatform">
      <textarea id="chatInput" rows="2" aria-label="Ask about NFL research" placeholder="Ask about a matchup, market price, source, or PASS reason"></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </section>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/product_ui.js?v=projection-20260924b"></script>
<script src="/static/app.js?v=projection-20260924b"></script>
</body>
</html>
