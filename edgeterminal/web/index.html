<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeTerminal</title>
<link rel="stylesheet" href="/static/style.css?v=neutral-20260924a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111111'/><text x='8' y='24' fill='%23f5f5f7' font-family='Arial' font-weight='700' font-size='23'>E</text></svg>">
</head>
<body>
<header id="topbar">
  <div class="brand">Edge<span>Terminal</span><span class="sr-only">NFL projections</span></div>
  <nav id="sections" aria-label="Primary navigation"></nav>
  <div class="topright">
    <span class="meta" id="lastUpdated">Updated —</span>
    <button id="chatToggle" class="btn" type="button">Research chat</button>
  </div>
</header>

<div id="shell">
  <main id="main"><div class="loading">Loading slate…</div></main>

  <section id="chat">
    <div class="chathead">
      <span>AI ANALYST</span>
      <span id="llmBadge" class="badge"></span>
      <button id="chatClose" class="iconbtn" title="Hide">×</button>
    </div>
    <div id="chatLog" class="chatlog"></div>
    <div class="suggest" id="suggest"></div>
    <form id="chatForm" class="chatform">
      <textarea id="chatInput" rows="2" aria-label="Ask about NFL research" placeholder="Ask about a matchup, market price, source, or PASS reason"></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </section>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/product_ui.js?v=neutral-20260924a"></script>
<script src="/static/app.js?v=neutral-20260924a"></script>
</body>
</html>
